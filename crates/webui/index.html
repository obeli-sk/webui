<!doctype html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
            const theme = localStorage.getItem("obelisk-webui-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (_) { }
        // Dark Reader's dynamic mode garbles SVG fills, so present our own dark theme and lock it out.
        new MutationObserver((_, observer) => {
            const root = document.documentElement;
            if (root.dataset.darkreaderMode !== "dynamic") return;
            observer.disconnect();
            root.dataset.theme = "dark";
            root.dataset.darkReaderLocked = "";
            const lock = document.createElement("meta");
            lock.name = "darkreader-lock";
            document.head.append(lock);
        }).observe(document.documentElement, { attributeFilter: ["data-darkreader-mode"] });
    </script>
    <link data-trunk rel="scss" href="/styles/styles.scss" />
    <link data-trunk rel="css" href="/syntect.css" />
    <link data-trunk rel="css" href="/syntect-light.css" />
    <link data-trunk rel="copy-file" href="/logo.png" />
    <link data-trunk rel="rust" data-type="main" />
    <meta charset="UTF-8">
    <title>Obelisk WebUI</title>
</head>

<body></body>

</html>
