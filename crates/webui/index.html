<!doctype html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
        try {
            const theme = localStorage.getItem("obelisk-webui-theme");
            if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
        } catch (_) { }
    </script>
    <link data-trunk rel="scss" href="/styles/styles.scss" />
    <link data-trunk rel="css" href="/syntect.css" />
    <link data-trunk rel="css" href="/syntect-light.css" />
    <link data-trunk rel="copy-file" href="/logo.png" />
    <link data-trunk rel="rust" data-type="main" />
    <meta charset="UTF-8">
    <title>Obelisk WebUI</title>
</head>

<body></body>

</html>
