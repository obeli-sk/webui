name: push-webui

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to be used when pushing components to the Docker Hub."
        required: true
        type: string
      ref:
        description: "The ref (branch or SHA) to process"
        required: false
        type: string

defaults:
  run:
    shell: bash -xe {0}

jobs:
  push-webui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          ref: ${{ github.event.inputs.ref }} # Use the ref if provided, otherwise defaults to the current branch/commit
          submodules: recursive
          persist-credentials: false

      - uses: nixbuild/nix-quick-install-action@v34
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          nix_conf: |
            extra-substituters = https://obeli-sk.cachix.org
            extra-trusted-public-keys = obeli-sk.cachix.org-1:31iM9GWSEhAXvvuTWQ7CvAcwvgRzsuJ9yJghywSd3Jw=

      - name: Populate the nix store
        run: nix develop --command echo

      - name: Validate release tag
        env:
          TAG: ${{ inputs.tag }}
          OBELISK_PR_TOKEN: ${{ secrets.WEBUI_TO_OBELISK_PR }}
        run: |
          [[ "$TAG" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]] || { echo "Tag $TAG must look like YYYY-MM-DD or YYYY-MM-DD-N" >&2; exit 1; }
          [[ -n "$OBELISK_PR_TOKEN" ]] || { echo 'Secret WEBUI_TO_OBELISK_PR is not set' >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists" >&2
            exit 1
          else
            status=$?
            [[ "$status" -eq 2 ]] || exit "$status"
          fi

      - name: Log in to Docker Hub
        run: |
          echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push webui
        id: push
        run: |
          nix develop --command ./scripts/push-webui.sh "$TAG" "$RUNNER_TEMP/webui-version.txt"
          echo "reference=$(cat "$RUNNER_TEMP/webui-version.txt")" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}

      - name: Open Obelisk version-bump PR
        env:
          GH_TOKEN: ${{ secrets.WEBUI_TO_OBELISK_PR }}
          WEBUI_REFERENCE: ${{ steps.push.outputs.reference }}
          TAG: ${{ inputs.tag }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/obeli-sk/obelisk.git" obelisk-clone
          cd obelisk-clone
          branch="bump/webui-${TAG}"
          git switch -c "$branch"
          printf '%s' "$WEBUI_REFERENCE" > crates/embedded-assets/webui-version.txt
          ./scripts/update-embedded-assets-hash.sh webui
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crates/embedded-assets/webui-version.txt flake.nix
          git commit -m "chore: bump webui to ${TAG}"
          git push origin "$branch"
          printf 'Automated WebUI bump to %s.\n\nOCI reference: %s\n' "$TAG" "$WEBUI_REFERENCE" > "$RUNNER_TEMP/obelisk-pr-body.md"
          gh pr create --repo obeli-sk/obelisk --base main --head "$branch" \
            --title "chore: bump webui to ${TAG}" \
            --body-file "$RUNNER_TEMP/obelisk-pr-body.md"

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" tag -a "$TAG" -m "Release $TAG"
          git -c credential.helper='!gh auth git-credential' push origin "refs/tags/$TAG"
